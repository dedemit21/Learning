      thumbs.forEach((t, i) => t.classList.toggle("active", i === currentSlide));

        focusTerminalInput(currentSlide);

      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) inp.focus();
    }

    function autoFillCmd(slideIdx, cmdText) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) {
        inp.value = cmdText;
        inp.focus();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlide = index;
        updateMeta();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateMeta();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateMeta();
      }
    }

        cmdHistory.push(rawCmd);
        historyIdx = cmdHistory.length;

        const entryHtml = document.createElement("div");
        entryHtml.className = "history-entry";
        entryHtml.innerHTML = `<div><span class="term-prompt">siswa@wikrama-lab</span>:<span class="term-path">${currentDir}</span><span class="term-char">$</span> ${escapeHtml(rawCmd)}</div>`;

        const [outputHtml, isSuccess] = executeMockKernelBash(rawCmd);
        entryHtml.innerHTML += outputHtml;
        historyDiv.appendChild(entryHtml);

        const cleanRaw = rawCmd.replace(/\s+/g, " ").trim();
        const cleanTarget = targetCommand.replace(/\s+/g, " ").trim();

        if (cleanTarget && (cleanRaw === cleanTarget || cleanRaw.includes(cleanTarget))) {
          statusBadge.className = "challenge-status status-success";
          statusBadge.innerText = "✓ TANTANGAN BERHASIL!";
          const successAlert = document.createElement("div");
          successAlert.className = "term-output success-msg";
          successAlert.innerText = "🎉 Luar biasa! Perintah tepat dan berhasil dievaluasi kernel simulasi.";
          historyDiv.appendChild(successAlert);
        }

        inp.value = "";
        const screen = document.getElementById(`term-screen-${slideIdx}`);
        screen.scrollTop = screen.scrollHeight;
      } else if (e.key === "ArrowUp") {
        if (cmdHistory.length > 0 && historyIdx > 0) {
          historyIdx--;
          inp.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inp.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          inp.value = "";
        }
      }
    }

    function executeMockKernelBash(cmd) {
      const parts = cmd.split(" ");
      const base = parts[0].toLowerCase();

      if (cmd.includes("| grep")) {
        const grepTarget = cmd.split("| grep")[1].replace(/["']/g, "").trim();
        if (cmd.startsWith("lsmod")) {
          return [`<div class="term-output">jbd2                  184320  1 ext4\next4                  983040  2</div>`, true];
        }
        if (cmd.startsWith("ps aux")) {
          if (grepTarget === "defunct") {
            return [`<div class="term-output">siswa     1842  0.0  0.0      0     0 pts/0    Z+   09:12   0:00 [bad_app] &lt;defunct&gt;</div>`, true];
          }
          return [`<div class="term-output">root      1042  0.0  0.2  18204  4210 ?        Ss   08:30   0:00 /usr/sbin/sshd -D</div>`, true];
        }
      }

      switch (base) {
        case "uname":
          if (cmd.includes("-r")) return [`<div class="term-output">6.8.0-45-generic</div>`, true];
          if (cmd.includes("-s")) return [`<div class="term-output">Linux</div>`, true];
          if (cmd.includes("-a")) return [`<div class="term-output">Linux wikrama-lab 6.8.0-45-generic #45-Ubuntu SMP PREEMPT_DYNAMIC x86_64 GNU/Linux</div>`, true];
          return [`<div class="term-output">Linux</div>`, true];

        case "whoami":
          return [`<div class="term-output">siswa</div>`, true];

        case "id":
          return [`<div class="term-output">uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo),1001(tkj)</div>`, true];

        case "clear":
          setTimeout(() => {
            const hist = document.getElementById(`cmd-history-output-${currentSlide}`);
            if (hist) hist.innerHTML = "";
          }, 50);
          return ["", true];

        case "ps":
          if (cmd.includes("aux")) {
            return [`<div class="term-output">USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND
root         1  0.0  0.1 168420 12400 ?        Ss   08:00   0:01 /sbin/init splash
root       412  0.0  0.2  45200  8400 ?        Ss   08:00   0:00 /lib/systemd/systemd-journald
root       890  0.0  0.3  18400  6200 ?        Ss   08:01   0:00 /usr/sbin/sshd -D
siswa     1240  0.0  0.4  22100  9100 pts/0    Ss   08:30   0:00 -bash
siswa     1842  0.0  0.0      0     0 pts/0    Z+   09:12   0:00 [bad_app] &lt;defunct&gt;
siswa     2014  0.0  0.1  18400  3200 pts/0    R+   09:35   0:00 ps aux</div>`, true];
          }
          if (cmd.includes("-ef")) {
            return [`<div class="term-output">UID        PID  PPID  C STIME TTY          TIME CMD
root         1     0  0 08:00 ?        00:00:01 /sbin/init
root       890     1  0 08:01 ?        00:00:00 /usr/sbin/sshd -D
siswa     1240   890  0 08:30 pts/0    00:00:00 -bash
siswa     2015  1240  0 09:35 pts/0    00:00:00 ps -ef</div>`, true];
          }
          if (cmd.includes("-o")) {
            return [`<div class="term-output">  PID  PPID COMMAND
 1240   890 bash
 2016  1240 ps</div>`, true];
          }
          return [`<div class="term-output">  PID TTY          TIME CMD
 1240 pts/0    00:00:00 bash
 2017 pts/0    00:00:00 ps</div>`, true];

        case "pstree":
          return [`<div class="term-output">systemd─┬─systemd-journal
        ├─sshd───sshd───bash───pstree
        └─cron</div>`, true];

        case "lsmod":
          return [`<div class="term-output">Module                  Size  Used by
ext4                  983040  2
jbd2                  184320  1 ext4
tls                   131072  0
intel_rapl_msr         20480  0</div>`, true];

        case "df":
          if (cmd.includes("-T") || cmd.includes("-t")) {
            return [`<div class="term-output">Filesystem     Type     1K-blocks      Used Available Use% Mounted on
/dev/sda2      ext4     499582320  14280140 460124180   4% /
/dev/sda1      vfat        524288      6420    517868   2% /boot/efi
tmpfs          tmpfs      8124020         0   8124020   0% /tmp</div>`, true];
          }
          return [`<div class="term-output">Filesystem     1K-blocks      Used Available Use% Mounted on
/dev/sda2      499582320  14280140 460124180   4% /
tmpfs            8124020         0   8124020   0% /tmp</div>`, true];

        case "stat":
          const targetFile = parts[1] || "/etc/passwd";
          return [`<div class="term-output">  File: ${escapeHtml(targetFile)}
  Size: 1842            Blocks: 8          IO Block: 4096   regular file
Device: 8,2             Inode: 1441824     Links: 1
Access: (0644/-rw-r--r--)  Uid: ( 0/ root)   Gid: ( 0/ root)
Access: 2026-09-21 08:30:12.000000000 +0700
Modify: 2026-09-21 08:28:40.000000000 +0700
Change: 2026-09-21 08:28:40.000000000 +0700</div>`, true];

        case "ls":
          if (cmd.includes("-i")) {
            return [`<div class="term-output">1441824 documents   1441825 downloads   1441826 target.txt</div>`, true];
          }
          if (cmd.includes("/proc/1/fd")) {
            return [`<div class="term-output">lrwx------ 1 root root 64 Sep 21 08:00 0 -> /dev/null
lrwx------ 1 root root 64 Sep 21 08:00 1 -> /dev/null
lrwx------ 1 root root 64 Sep 21 08:00 2 -> /dev/null</div>`, true];
          }
          return [`<div class="term-output" style="color:#38bdf8; font-weight:600;">documents   downloads   target.txt</div>`, true];

        case "cat":
          const f = parts[1] || "";
          if (virtualKernelFS[f]) {
            return [`<div class="term-output">${escapeHtml(virtualKernelFS[f])}</div>`, true];
          }
          return [`<div class="term-output error">cat: ${escapeHtml(f)}: No such file or directory</div>`, false];

        case "dmesg":
          return [`<div class="term-output">[    0.000000] Linux version 6.8.0-45-generic
[    0.000000] Command line: BOOT_IMAGE=/boot/vmlinuz-6.8.0-45-generic root=/dev/sda2 ro splash
[    0.001420] x86/fpu: Supporting XSAVE feature 0x001: 'x87 floating point registers'
[    1.240120] EXT4-fs (sda2): mounted filesystem 5b4c12 with ordered data mode.
[    2.104200] systemd[1]: Starting OpenSSH server daemon...</div>`, true];

        case "top":
          return [`<div class="term-output">top - 09:35:10 up  1:35,  1 user,  load average: 0.15, 0.18, 0.12
Tasks: 184 total,   1 running, 182 sleeping,   0 stopped,   1 zombie
%Cpu(s):  1.2 us,  0.5 sy,  0.0 ni, 98.2 id,  0.1 wa,  0.0 hi,  0.0 si

    PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND
   1240 siswa     20   0   22100   9100   4200 S   0.7   0.1   0:00.42 bash
    890 root      20   0   18400   6200   3100 S   0.0   0.0   0:00.08 sshd</div>`, true];

        case "kill":
          if (cmd.includes("-l")) {
            return [`<div class="term-output"> 1) SIGHUP   2) SIGINT   3) SIGQUIT  9) SIGKILL  15) SIGTERM</div>`, true];
          }
          return [`<div class="term-output" style="color:#34d399;">Process terminated.</div>`, true];

        case "systemctl":
          if (cmd.includes("status")) {
            return [`<div class="term-output">● sshd.service - OpenSSH server daemon
     Loaded: loaded (/lib/systemd/system/ssh.service; enabled; vendor preset: enabled)
     Active: <span style="color:#10b981; font-weight:bold;">active (running)</span> since Mon 2026-09-21 08:01:10 WIB; 1h 34min ago
   Main PID: 890 (sshd)</div>`, true];
          }
          return [`<div class="term-output">UNIT            LOAD   ACTIVE SUB     DESCRIPTION
cron.service    loaded active running Regular background program processing daemon
sshd.service    loaded active running OpenSSH server daemon</div>`, true];

        case "mount":
          return [`<div class="term-output">/dev/sda2 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)
tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)</div>`, true];

        case "file":
          return [`<div class="term-output">${parts[1] || "file"}: ELF 64-bit LSB pie executable, x86-64, version 1 (SYSV), dynamically linked</div>`, true];

        case "sha256sum":
          return [`<div class="term-output">5b2f84c2084c8a16709849204018241029482402102402104209420842094820  ${parts[1] || "file"}</div>`, true];

        case "echo":
          const textMatch = cmd.match(/echo\s+["']?([^"'>]+)["']?/);
          return [`<div class="term-output">${escapeHtml(textMatch ? textMatch[1] : parts.slice(1).join(" "))}</div>`, true];

        default:
          return [`<div class="term-output error">bash: ${escapeHtml(base)}: command not found</div>`, false];
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("keydown", (e) => {
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.classList.contains("term-input") || activeEl.id === "sidebar-filter");

      if (e.key === "m" || e.key === "M") {
        if (!isTyping) {
          e.preventDefault();
          toggleSidebar();
          return;
        }
      }

      if (e.key === "Escape") {
        if (slideSidebar.classList.contains("open")) {
          toggleSidebar();
          return;
        }
      }

      if (!isTyping) {
        if (e.key === "ArrowRight" || e.key === " ") {
          nextSlide();
        } else if (e.key === "ArrowLeft") {
          prevSlide();
        }
      }
    });

    renderDeck();
  </script>
