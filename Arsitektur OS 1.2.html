      color: var(--text-main);
      line-height: 1.2;

    .terminal-container {
      background: var(--terminal-bg);

    .terminal-dots {

      align-items: center;
      gap: 6px;

    .dot {

      height: 10px;
      border-radius: 50%;

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .challenge-status {

    .terminal-screen {

      padding: 12px 16px;
      font-family: var(--font-mono);

    .term-prompt {

    .term-path {

    .term-char {

    .term-output {

    .term-output.error {

    .outro-title {

    function focusTerminalInput(slideIdx) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) inp.focus();

    function autoFillCmd(slideIdx, cmdText) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) {
        inp.value = cmdText;
        inp.focus();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlide = index;
        updateMeta();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateMeta();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateMeta();
      }
    }

    // Engine Eksekusi Terminal Bash Simulasi
    function handleTerminalInput(e, slideIdx, targetCommand) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      const historyDiv = document.getElementById(`cmd-history-output-${slideIdx}`);
      const statusBadge = document.getElementById(`status-badge-${slideIdx}`);

      if (e.key === "Enter") {
        const rawCmd = inp.value.trim();
        if (!rawCmd) return;

        cmdHistory.push(rawCmd);
        historyIdx = cmdHistory.length;

        const entryHtml = document.createElement("div");
        entryHtml.className = "history-entry";
        entryHtml.innerHTML = `<div><span class="term-prompt">siswa@wikrama-lab</span>:<span class="term-path">${currentDir}</span><span class="term-char">$</span> ${escapeHtml(rawCmd)}</div>`;

        const [outputHtml, isSuccess] = executeMockBash(rawCmd);
        entryHtml.innerHTML += outputHtml;
        historyDiv.appendChild(entryHtml);

        const cleanRaw = rawCmd.replace(/\s+/g, " ").trim();
        const cleanTarget = targetCommand.replace(/\s+/g, " ").trim();

        if (cleanTarget && (cleanRaw === cleanTarget || cleanRaw.includes(cleanTarget))) {
          statusBadge.className = "challenge-status status-success";
          statusBadge.innerText = "✓ TANTANGAN BERHASIL!";
          const successAlert = document.createElement("div");
          successAlert.className = "term-output success-msg";
          successAlert.innerText = "🎉 Bagus sekali! Perintah tepat dan berhasil dieksekusi.";
          historyDiv.appendChild(successAlert);
        }

        inp.value = "";
        const screen = document.getElementById(`term-screen-${slideIdx}`);
        screen.scrollTop = screen.scrollHeight;
      } else if (e.key === "ArrowUp") {
        if (cmdHistory.length > 0 && historyIdx > 0) {
          historyIdx--;
          inp.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inp.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          inp.value = "";
        }
      }
    }

    function executeMockBash(cmd) {
      const parts = cmd.split(" ");
      const base = parts[0].toLowerCase();

      // Penanganan Operator Pipeline
      if (cmd.includes("| grep")) {
        const grepTarget = cmd.split("| grep")[1].replace(/["']/g, "").trim();
        if (cmd.startsWith("cat status.txt")) {
          return [`<div class="term-output">Kasus 01 Selesai\nKasus 02 Dibuka</div>`, true];
        }
        if (cmd.startsWith("cat /var/log/auth.log")) {
          const lines = virtualFiles["/var/log/auth.log"].split("\n");
          const res = lines.filter(l => l.toLowerCase().includes(grepTarget.toLowerCase())).join("\n");
          return [`<div class="term-output" style="color:#a7f3d0;">${escapeHtml(res || "Tidak ada hasil cocok.")}</div>`, true];
        }
      }

      switch (base) {
        case "pwd":
          return [`<div class="term-output">${currentDir === "~" ? "/home/siswa" : currentDir}</div>`, true];

        case "whoami":
          return [`<div class="term-output">siswa</div>`, true];

        case "id":
          return [`<div class="term-output">uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo),1001(tkj)</div>`, true];

        case "wc":
          return [`<div class="term-output">4 /var/log/auth.log</div>`, true];

        case "clear":
          setTimeout(() => {
            const hist = document.getElementById(`cmd-history-output-${currentSlide}`);
            if (hist) hist.innerHTML = "";
          }, 50);
          return ["", true];

        case "history":
          let histOut = cmdHistory.map((c, i) => `  ${String(i + 1).padStart(4, " ")}  ${escapeHtml(c)}`).join("\n");
          return [`<div class="term-output">${histOut || "  1  history"}</div>`, true];

        case "echo":
          if (cmd.includes("$SHELL")) return [`<div class="term-output">/bin/bash</div>`, true];
          if (cmd.includes("$PATH")) return [`<div class="term-output">/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin</div>`, true];
          if (cmd.includes("> status.txt") || cmd.includes(">> status.txt")) {
            return ["", true];
          }
          const textMatch = cmd.match(/echo\s+["']?([^"'>]+)["']?/);
          const echoText = textMatch ? textMatch[1] : parts.slice(1).join(" ");
          return [`<div class="term-output">${escapeHtml(echoText)}</div>`, true];

        case "cd":
          const target = parts[1] || "~";
          if (target === "~" || target === "/home/siswa") {
            currentDir = "~";
            return ["", true];
          } else if (target === "/var/log" || target === "log") {
            currentDir = "/var/log";
            return ["", true];
          } else if (target === "..") {
            currentDir = currentDir === "/var/log" ? "/var" : "/";
            return ["", true];
          } else if (target === "/folder_palsu") {
            return [`<div class="term-output error">bash: cd: /folder_palsu: No such file or directory</div>`, false];
          } else {
            return [`<div class="term-output error">bash: cd: ${escapeHtml(target)}: No such file or directory</div>`, false];
          }

        case "ls":
          const isAll = cmd.includes("-a") || cmd.includes("-la") || cmd.includes("-al");
          let list = virtualFS[currentDir] || ["target.txt", "status.txt"];
          if (!isAll) {
            list = list.filter(f => !f.startsWith("."));
          }
          if (cmd.includes("-l")) {
            const longOut = list.map(f => {
              const isDir = f.endsWith("/") || f === "documents" || f === "downloads";
              const perm = isDir ? "drwxr-xr-x 2 siswa siswa 4096 Sep 21 08:30 " : "-rw-r--r-- 1 siswa siswa 1024 Sep 21 08:30 ";
              return `${perm} ${f}`;
            }).join("\n");
            return [`<div class="term-output">${escapeHtml(longOut)}</div>`, true];
          }
          return [`<div class="term-output" style="color: #38bdf8; font-weight: 600;">${list.join("   ")}</div>`, true];

        case "cat":
          const fileToRead = parts[1] || "";
          if (!fileToRead) return [`<div class="term-output error">cat: missing operand</div>`, false];
          if (virtualFiles[fileToRead]) {
            return [`<div class="term-output">${escapeHtml(virtualFiles[fileToRead])}</div>`, true];
          }
          return [`<div class="term-output error">cat: ${escapeHtml(fileToRead)}: No such file or directory</div>`, false];

        case "tail":
          return [`<div class="term-output">Sep 21 10:14:02 srv sshd[1210]: Failed password for admin from 192.168.1.105 port 44214
Sep 21 10:15:20 srv sshd[1220]: Accepted password for siswa from 192.168.1.50 port 51200</div>`, true];

        case "touch":
          const newFile = parts[1] || "file.txt";
          if (!virtualFS[currentDir]) virtualFS[currentDir] = [];
          if (!virtualFS[currentDir].includes(newFile)) virtualFS[currentDir].push(newFile);
          virtualFiles[newFile] = "";
          return ["", true];

        case "mkdir":
          const newDir = parts[1] || "new_folder";
          if (!virtualFS[currentDir]) virtualFS[currentDir] = [];
          virtualFS[currentDir].push(newDir + "/");
          return ["", true];

        case "cp":
        case "mv":
        case "rm":
          return ["", true];

        case "find":
          return [`<div class="term-output">./status.txt\n./target.txt\n./documents/catatan.txt</div>`, true];

        case "cut":
          return [`<div class="term-output">Kasus\nKasus</div>`, true];

        case "grep":
          if (cmd.includes("Failed") || cmd.includes("failed")) {
            const lines = virtualFiles["/var/log/auth.log"].split("\n");
            const filtered = lines.filter(l => l.toLowerCase().includes("failed")).join("\n");
            if (cmd.includes("-c")) return [`<div class="term-output">3</div>`, true];
            return [`<div class="term-output" style="color: #fca5a5;">${escapeHtml(filtered)}</div>`, true];
          } else if (cmd.includes("Accepted")) {
            return [`<div class="term-output" style="color: #86efac;">Sep 21 10:15:20 srv sshd[1220]: Accepted password for siswa from 192.168.1.50 port 51200</div>`, true];
          } else if (cmd.includes("-v \"root\"")) {
            return [`<div class="term-output">Sep 21 10:14:02 srv sshd[1210]: Failed password for admin from 192.168.1.105 port 44214\nSep 21 10:15:20 srv sshd[1220]: Accepted password for siswa from 192.168.1.50 port 51200</div>`, true];
          } else if (cmd.includes("^Sep")) {
            return [`<div class="term-output">${escapeHtml(virtualFiles["/var/log/auth.log"])}</div>`, true];
          } else if (cmd.includes("51200$")) {
            return [`<div class="term-output">Sep 21 10:15:20 srv sshd[1220]: Accepted password for siswa from 192.168.1.50 port 51200</div>`, true];
          } else if (cmd.includes("--help")) {
            return [`<div class="term-output">Usage: grep [OPTION...] PATTERNS [FILE...]
Search for PATTERNS in each FILE.
Example: grep -i 'hello world' menu.h main.c

Pattern selection and interpretation:
  -E, --extended-regexp     PATTERNS are extended regular expressions
  -F, --fixed-strings       PATTERNS are strings
  -G, --basic-regexp        PATTERNS are basic regular expressions
  -e, --regexp=PATTERNS     use PATTERNS for matching
  -f, --file=FILE           take PATTERNS from FILE
  -i, --ignore-case         ignore case distinctions in patterns and data</div>`, true];
          }
          return [`<div class="term-output">Usage: grep [OPTION...] PATTERNS [FILE...]</div>`, true];

        default:
          return [`<div class="term-output error">bash: ${escapeHtml(base)}: command not found</div>`, false];
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("keydown", (e) => {
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.classList.contains("term-input") || activeEl.id === "sidebar-filter");

      if (e.key === "m" || e.key === "M") {
        if (!isTyping) {
          e.preventDefault();
          toggleSidebar();
          return;
        }
      }

      if (e.key === "Escape") {
        if (slideSidebar.classList.contains("open")) {
          toggleSidebar();
          return;
        }
      }

      if (!isTyping) {
        if (e.key === "ArrowRight" || e.key === " ") {
          nextSlide();
        } else if (e.key === "ArrowLeft") {
          prevSlide();
        }
      }
    });

    renderDeck();
  </script>
</body>
</html>
