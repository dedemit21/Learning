<!DOCTYPE html>

      --accent-cyan: #0284c7;

    * {

      margin: 0;
      padding: 0;
    }

    body {

      color: var(--text-main);

    /* Top Bar */

    .menu-toggle-btn {

      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .menu-toggle-btn:hover {
      background: #334155;
      border-color: #38bdf8;

    }

    .top-bar .title {
      color: #f8fafc;

    .session-badge {

      color: #38bdf8;

      font-size: 0.72rem;
      font-weight: 600;

    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .counter-text {
      font-family: var(--font-mono);
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.88rem;

    .nav-arrow-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      width: 32px;
      height: 32px;
      border-radius: 8px;

      align-items: center;

      cursor: pointer;

      background: #334155;

    /* Sidebar Drawer (Thumbnail Preview) */
    .sidebar-overlay {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 56px);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      width: 380px;
      max-width: 85vw;
      height: calc(100vh - 56px);
      background: #0f172a;
      border-right: 1px solid #1e293b;
      z-index: 40;
      transform: translateX(-100%);

      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .slide-sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 700;

    .sidebar-close-btn {

      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-family: var(--font-sans);

    .sidebar-scroll-list {

      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .thumb-card:hover {
      background: #273549;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .thumb-card.active {
      background: rgba(2, 132, 199, 0.15);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .thumb-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
    }

    .thumb-num {
      font-family: var(--font-mono);
      font-weight: 700;
      color: #38bdf8;
    }

    .thumb-tag {
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 600;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stage Presentation */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      min-height: 0;
    }

    .slide-card {
      background: var(--card-bg);
      border-radius: 18px;
      width: 96%;
      max-width: 1260px;
      height: 92%;
      padding: 32px 42px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slide-card.active {
      display: flex;
    }

    .slide-card.cover-card {

      color: #ffffff;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 30px 40px;
    }

    .cover-top-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .cover-program {
      font-size: 0.82rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .cover-subprogram {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .cover-chapter-badge {
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .cover-main-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .cover-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
    }

    .cover-subtitle {
      font-size: 1.05rem;
      color: #94a3b8;
      max-width: 800px;
      line-height: 1.5;
    }

    .cover-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 860px;
      gap: 16px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .teacher-card {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .teacher-avatar {
      width: 38px;
      height: 38px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .teacher-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .teacher-certs {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: #38bdf8;
    }

    .meta-pills {
      display: flex;
      gap: 10px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      color: #cbd5e1;
    }

    .meta-pill-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* Standard Card Header */
    .slide-header {
      margin-bottom: 14px;
    }

    .slide-category {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .slide-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    /* Split Layout */
    .slide-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: stretch;
      min-height: 0;
    }

    .text-content {
      font-size: 1.08rem;
      line-height: 1.6;
      color: var(--text-muted);
      overflow-y: auto;
      padding-right: 8px;
    }

    .text-content ul {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text-content li strong {
      color: var(--text-main);
    }

    /* Live Interactive Terminal */
    .terminal-container {
      background: var(--terminal-bg);
      border: 1px solid #1f293d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      height: 100%;
      min-height: 310px;
    }

    .terminal-header-bar {
      background: #111722;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f293d;
    }

    .terminal-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .terminal-tab-title {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: #94a3b8;
    }

    .challenge-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: var(--font-sans);
    }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }

    .terminal-screen {
      flex: 1;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      color: #f1f5f9;
      overflow-y: auto;
      cursor: text;
    }

    .history-entry {
      margin-bottom: 6px;
    }

    .term-prompt {
      color: #38bdf8;
      font-weight: 600;
    }

    .term-path {
      color: #a855f7;
    }

    .term-char {
      color: #f8fafc;
    }

    .term-output {
      color: #cbd5e1;
      margin-top: 2px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .term-output.error {
      color: #f87171;
    }

    .term-output.success-msg {
      color: #34d399;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 4px;
      border-left: 3px solid #10b981;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #a7f3d0;
      caret-color: #38bdf8;
    }

    .terminal-footer-hint {
      background: #080c14;
      padding: 6px 14px;
      font-size: 0.72rem;
      color: #64748b;
      border-top: 1px solid #1f293d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .copy-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: var(--font-mono);
    }
    .copy-btn:hover { background: #334155; }

    /* Outro Slide (Slide 50) */
    .slide-card.outro-card {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #09101f 80%);
      color: #ffffff;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px 40px;
    }

    .outro-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .outro-quote {
      font-size: 1.05rem;
      color: #93c5fd;
      max-width: 760px;
      line-height: 1.55;
      font-style: italic;
      margin-bottom: 24px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 20px;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .contact-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: #38bdf8;
    }

    .contact-icon {
      font-size: 1.6rem;
    }

    .contact-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-val {
      font-size: 0.9rem;
      font-family: var(--font-mono);
      color: #f8fafc;
      font-weight: 600;
    }

    /* Bottom Bar */
    .bottom-bar {
      height: 44px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.82rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bottom-bar kbd {
      background: #1e293b;
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
  </style>
</head>

  <!-- Top Bar -->
  <div class="top-bar">

      const inp = document.getElementById(`term-input-${slideIdx}`);

        currentSlide++;

    function handleTerminalInput(e, slideIdx, targetCommand) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      const historyDiv = document.getElementById(`cmd-history-output-${slideIdx}`);
      const statusBadge = document.getElementById(`status-badge-${slideIdx}`);

      if (e.key === "Enter") {
        const rawCmd = inp.value.trim();
        if (!rawCmd) return;

        cmdHistory.push(rawCmd);
        historyIdx = cmdHistory.length;

        const entryHtml = document.createElement("div");
        entryHtml.className = "history-entry";
        entryHtml.innerHTML = `<div><span class="term-prompt">siswa@wikrama-lab</span>:<span class="term-path">${currentDir}</span><span class="term-char">$</span> ${escapeHtml(rawCmd)}</div>`;

        const [outputHtml, isSuccess] = executeMockFHSBash(rawCmd);
        entryHtml.innerHTML += outputHtml;
        historyDiv.appendChild(entryHtml);

        const cleanRaw = rawCmd.replace(/\s+/g, " ").trim();
        const cleanTarget = targetCommand.replace(/\s+/g, " ").trim();

        if (cleanTarget && (cleanRaw === cleanTarget || cleanRaw.includes(cleanTarget))) {
          statusBadge.className = "challenge-status status-success";
          statusBadge.innerText = "✓ TANTANGAN BERHASIL!";
          const successAlert = document.createElement("div");
          successAlert.className = "term-output success-msg";
          successAlert.innerText = "🎉 Bagus sekali! Sintaks perintah FHS / Hak Akses berhasil dievaluasi tepat.";
          historyDiv.appendChild(successAlert);
        }

        inp.value = "";
        const screen = document.getElementById(`term-screen-${slideIdx}`);
        screen.scrollTop = screen.scrollHeight;
      } else if (e.key === "ArrowUp") {
        if (cmdHistory.length > 0 && historyIdx > 0) {
          historyIdx--;
          inp.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inp.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          inp.value = "";
        }
      }
    }

    function executeMockFHSBash(cmd) {
      const parts = cmd.split(" ");
      const base = parts[0].toLowerCase();

      // Penanganan Pipeline & Redirection
      if (cmd.includes("grep tmpfs")) {
        return [`<div class="term-output">tmpfs       /tmp    tmpfs   defaults,noexec,nosuid,nodev  0  0</div>`, true];
      }
      if (cmd.includes("find / -perm -4000") || cmd.includes("find /usr/bin -perm -4000") || cmd.includes("find /usr -perm -4000")) {
        return [`<div class="term-output">/usr/bin/passwd\n/usr/bin/sudo\n/usr/bin/chsh\n/usr/bin/newgrp\n/usr/bin/pkexec</div>`, true];
      }
      if (cmd.includes("find / -perm -1000") || cmd.includes("find / -perm -2000")) {
        return [`<div class="term-output">/tmp\n/var/tmp\n/var/crash</div>`, true];
      }

      switch (base) {
        case "pwd":
          return [`<div class="term-output">${currentDir === "~" ? "/home/siswa" : currentDir}</div>`, true];

        case "whoami":
          return [`<div class="term-output">siswa</div>`, true];

        case "id":
          return [`<div class="term-output">uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo),1001(tkj)</div>`, true];

        case "clear":
          setTimeout(() => {
            const hist = document.getElementById(`cmd-history-output-${currentSlide}`);
            if (hist) hist.innerHTML = "";
          }, 50);
          return ["", true];

        case "cd":
          const target = parts[1] || "~";
          if (target === "/" || target === "/root") {
            currentDir = "/";
            return ["", true];
          } else if (target === "~" || target === "/home/siswa") {
            currentDir = "~";
            return ["", true];
          } else if (target === "/var/log" || target === "/var" || target === "/tmp") {
            currentDir = target;
            return ["", true];
          }
          return [`<div class="term-output error">bash: cd: ${escapeHtml(target)}: No such file or directory</div>`, false];

        case "ls":
          if (cmd.includes("-ld /") || cmd === "ls -ld /") {
            return [`<div class="term-output">drwxr-xr-x 19 root root 4096 Sep 21 08:00 /</div>`, true];
          }
          if (cmd.includes("-ld /tmp")) {
            return [`<div class="term-output">drwxrwxrwt 25 root root 4096 Sep 21 09:30 /tmp</div>`, true];
          }
          if (cmd.includes("-ld /var/tmp")) {
            return [`<div class="term-output">drwxrwxrwt  2 root root 4096 Sep 21 08:00 /var/tmp</div>`, true];
          }
          if (cmd.includes("-ld /bin /sbin")) {
            return [`<div class="term-output">lrwxrwxrwx 1 root root 7 Sep 21 08:00 /bin -> usr/bin\nlrwxrwxrwx 1 root root 8 Sep 21 08:00 /sbin -> usr/bin</div>`, true];
          }
          if (cmd.includes("-F /")) {
            return [`<div class="term-output" style="color:#38bdf8;">bin@   boot/  dev/   etc/   home/  lib@   opt/   proc/  root/  run/   sbin@  sys/   tmp/   usr/   var/</div>`, true];
          }
          if (cmd.includes("-l /etc/shadow")) {
            return [`<div class="term-output">-rw-r----- 1 root shadow 1420 Sep 21 08:30 /etc/shadow</div>`, true];
          }
          if (cmd.includes("/var/log")) {
            return [`<div class="term-output">auth.log   syslog   dpkg.log   nginx/   journal/   kern.log</div>`, true];
          }
          if (cmd.includes("-l /dev/urandom") || cmd.includes("-l /dev/null")) {
            return [`<div class="term-output">crw-rw-rw- 1 root root 1, 3 Sep 21 08:00 /dev/null\ncrw-rw-rw- 1 root root 1, 9 Sep 21 08:00 /dev/urandom</div>`, true];
          }
          if (cmd.includes("/boot")) {
            return [`<div class="term-output">vmlinuz-6.8.0-45-generic   initrd.img-6.8.0-45-generic   config-6.8.0-45-generic   grub/</div>`, true];
          }
          if (cmd.includes("-l /etc/passwd")) {
            return [`<div class="term-output">-rw-r--r-- 1 root root 1840 Sep 21 08:30 /etc/passwd</div>`, true];
          }
          if (cmd.includes("-ld /home/siswa")) {
            return [`<div class="term-output">drwxr-x--- 14 siswa siswa 4096 Sep 21 08:30 /home/siswa</div>`, true];
          }
          if (cmd.includes("-l /usr/bin/passwd")) {
            return [`<div class="term-output">-rwsr-xr-x 1 root root 68208 Mar 23  2024 /usr/bin/passwd</div>`, true];
          }
          if (cmd.includes("-l app.sh")) {
            return [`<div class="term-output">-rwxr-xr-x 1 siswa siswa 240 Sep 21 09:10 app.sh</div>`, true];
          }
          if (cmd.includes("-l id_rsa")) {
            return [`<div class="term-output">-rw------- 1 siswa siswa 2602 Sep 21 09:12 id_rsa</div>`, true];
          }
          if (cmd.includes("-l test_umask.txt")) {
            return [`<div class="term-output">-rw-r--r-- 1 siswa siswa 0 Sep 21 09:15 test_umask.txt</div>`, true];
          }
          if (cmd.includes("-l secure_doc.txt")) {
            return [`<div class="term-output">-rw-r----- 1 siswa siswa 0 Sep 21 09:16 secure_doc.txt</div>`, true];
          }
          if (cmd.includes("-ld finance_share")) {
            return [`<div class="term-output">drwxrws--t 2 siswa tkj 4096 Sep 21 09:20 finance_share</div>`, true];
          }
          return [`<div class="term-output">app.sh   evidence/   id_rsa   status.txt   test_umask.txt</div>`, true];

        case "stat":
          if (cmd.includes("-c")) {
            return [`<div class="term-output">755 app.sh</div>`, true];
          }
          return [`<div class="term-output">  File: app.sh\n  Size: 240         Blocks: 8          IO Block: 4096   regular file\nDevice: 8,2         Inode: 1441829     Links: 1\nAccess: (0755/-rwxr-xr-x)  Uid: ( 1000/ siswa)   Gid: ( 1000/ siswa)</div>`, true];

        case "df":
          return [`<div class="term-output">Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda2        40G   14G   24G  37% /\n/dev/sdb1        50G   12G   36G  25% /var</div>`, true];

        case "findmnt":
          return [`<div class="term-output">TARGET  SOURCE     FSTYPE OPTIONS\n/       /dev/sda2  ext4   rw,relatime,errors=remount-ro\n├─/tmp  tmpfs      tmpfs  rw,nosuid,nodev,noexec,relatime\n└─/var  /dev/sdb1  ext4   rw,relatime</div>`, true];

        case "umask":
          if (cmd.includes("-S")) {
            return [`<div class="term-output">u=rwx,g=rx,o=rx</div>`, true];
          }
          if (cmd.includes("027")) {
            userUmask = "0027";
            return ["", true];
          }
          return [`<div class="term-output">${userUmask}</div>`, true];

        case "chmod":
        case "chown":
        case "chgrp":
        case "touch":
        case "mkdir":
          return ["", true];

        case "cat":
          const f = parts[1] || "";
          if (virtualFiles[f]) {
            return [`<div class="term-output">${escapeHtml(virtualFiles[f])}</div>`, true];
          }
          return [`<div class="term-output error">cat: ${escapeHtml(f)}: No such file or directory</div>`, false];

        case "echo":
          const textMatch = cmd.match(/echo\s+["']?([^"'>]+)["']?/);
          return [`<div class="term-output">${escapeHtml(textMatch ? textMatch[1] : parts.slice(1).join(" "))}</div>`, true];

        default:
          return [`<div class="term-output error">bash: ${escapeHtml(base)}: command not found</div>`, false];
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("keydown", (e) => {
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.classList.contains("term-input") || activeEl.id === "sidebar-filter");

      if (e.key === "m" || e.key === "M") {
        if (!isTyping) {
          e.preventDefault();
          toggleSidebar();
          return;
        }
      }

      if (e.key === "Escape") {
        if (slideSidebar.classList.contains("open")) {
          toggleSidebar();
          return;
        }
      }

      if (!isTyping) {
        if (e.key === "ArrowRight" || e.key === " ") {
          nextSlide();
        } else if (e.key === "ArrowLeft") {
          prevSlide();
        }
      }
    });

    renderDeck();
  </script>
