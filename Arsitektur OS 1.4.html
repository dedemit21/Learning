<!DOCTYPE html>

      height: 92%;

      font-size: 0.76rem;
      font-weight: 600;

      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 10px 0;

    .cover-title {

      font-weight: 900;
      color: #ffffff;

    .cover-subtitle {

      color: #94a3b8;

      line-height: 1.5;

    .cover-bottom-bar {

      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 860px;
      gap: 16px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);

    .teacher-card {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .teacher-avatar {

      height: 38px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);

      align-items: center;

      font-weight: 700;
      color: #f8fafc;

    .teacher-certs {

      font-family: var(--font-mono);
      color: #38bdf8;
    }

    .meta-pills {
      display: flex;
      gap: 10px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      color: #cbd5e1;
    }

    .meta-pill-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* Standard Card Header */
    .slide-header {
      margin-bottom: 14px;
    }

    .slide-category {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .slide-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    /* Split Layout */
    .slide-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: stretch;
      min-height: 0;
    }

    .text-content {
      font-size: 1.08rem;
      line-height: 1.6;
      color: var(--text-muted);
      overflow-y: auto;
      padding-right: 8px;
    }

    .text-content ul {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text-content li strong {
      color: var(--text-main);
    }

    /* Live Interactive Terminal */
    .terminal-container {
      background: var(--terminal-bg);
      border: 1px solid #1f293d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      height: 100%;
      min-height: 310px;
    }

    .terminal-header-bar {
      background: #111722;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f293d;
    }

    .terminal-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .terminal-tab-title {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: #94a3b8;
    }

    .challenge-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: var(--font-sans);
    }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }

    .terminal-screen {
      flex: 1;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      color: #f1f5f9;
      overflow-y: auto;
      cursor: text;
    }

    .history-entry {
      margin-bottom: 6px;
    }

    .term-prompt {
      color: #38bdf8;
      font-weight: 600;
    }

    .term-path {
      color: #a855f7;
    }

    .term-char {
      color: #f8fafc;
    }

    .term-output {
      color: #cbd5e1;
      margin-top: 2px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .term-output.error {
      color: #f87171;
    }

    .term-output.success-msg {
      color: #34d399;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 4px;
      border-left: 3px solid #10b981;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .term-input {
      flex: 1;

      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;

      caret-color: #38bdf8;

    .terminal-footer-hint {
      background: #080c14;
      padding: 6px 14px;
      font-size: 0.72rem;
      color: #64748b;
      border-top: 1px solid #1f293d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .copy-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: var(--font-mono);

    .copy-btn:hover { background: #334155; }

    /* Outro Slide (Slide 50) */
    .slide-card.outro-card {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #09101f 80%);
      color: #ffffff;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px 40px;
    }

    .outro-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .outro-quote {
      font-size: 1.05rem;
      color: #93c5fd;
      max-width: 760px;
      line-height: 1.55;
      font-style: italic;
      margin-bottom: 24px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 20px;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 14px;

      align-items: center;

    }

    .contact-card:hover {

    .contact-icon {

    .contact-label {

      font-size: 0.9rem;
      font-family: var(--font-mono);
      color: #f8fafc;

    }

    /* Bottom Bar */
    .bottom-bar {
      height: 44px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.82rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bottom-bar kbd {
      background: #1e293b;
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);

  </style>

<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-left-group">
      <button class="menu-toggle-btn" onclick="toggleSidebar()" title="Buka Daftar 50 Slide (Tekan M)">
        <span>☰</span>
        <span>Daftar Slide</span>
      </button>
      <div class="title">
        <span>TKJ SMK Wikrama • Bab 1 Sub-Bab 1.4: Manajemen Akun & Hak Istimewa</span>

  <script>
    let currentDir = "~";
    let cmdHistory = [];
    let historyIdx = -1;

    // Database 50 Slide Lengkap Sub-Bab 1.4
    const slidesData = [
      // SLIDE 1: COVER
      {
        isCover: true,
        program: "Program Keahlian: Teknik Jaringan Komputer dan Telekomunikasi",
        subprogram: "Konsentrasi Keahlian: Teknik Komputer dan Jaringan",
        chapter: "Bab 1: Arsitektur OS (Linux & Windows) & CLI",
        title: "Sub-Bab 1.4: Manajemen Akun, Grup, & Hak Istimewa",
        subtitle: "Penguasaan Database Akun Linux (/etc/passwd & /etc/shadow), Delegasi Wewenang Superuser (Sudoers), Audit Kredensial, serta Komparasi dengan Windows UAC",
        teacher: "Ardi Ariansyah, S.Kom., Gr.",
        certs: "MTCNA, MTCRE, ACTR, JPT, DFA, L1 SOC, EHE",
        meta1: "Alokasi: 3 Sesi Praktikum",
        meta2: "Total: 50 Slide Interaktif",
        terminalCmd: "id && sudo -l",
        terminalOut: "uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo)\nUser siswa may run the following commands on wikrama-lab:\n    (ALL : ALL) ALL",
        sesi: "COVER MODUL"
      },
      // SLIDE 2: ROADMAP
      {
        cat: "PETA KOMPETENSI",
        title: "Roadmap Pembelajaran Sub-Bab 1.4",
        bullets: [
          "<strong>Sesi 1 (Slide 1–17):</strong> Arsitektur Database Akun Linux (/etc/passwd, /etc/shadow, /etc/group), Format UID/GID, dan Siklus Hidup Akun (useradd, usermod, userdel).",
          "<strong>Sesi 2 (Slide 18–34):</strong> Manajemen Grup (groupadd, gpasswd), Tata Kelola Kata Sandi & Penuaan Akun (chage, passwd), serta Pemantauan Sesi Aktif (who, w, last).",
          "<strong>Sesi 3 (Slide 35–50):</strong> Delegasi Hak Akses Superuser (sudo vs su), Konfigurasi Aman visudo (/etc/sudoers), Celah NOPASSWD, Komparasi Windows UAC, dan Hardening Akun."

        targetCmd: "whoami",
        targetHint: "Periksa nama pengguna sesi aktif Anda dengan mengetik: whoami",
        sesi: "SESI 1: DATABASE AKUN & PENGGUNA"

      // SLIDE 3: KONSEP IDENTITAS SISTEM
      {
        cat: "IDENTITAS ENTITAS",
        title: "Konsep Akun Pengguna pada Sistem Operasi",
        bullets: [
          "Linux dan Windows adalah sistem operasi multi-user dengan pemisahan privilese yang ketat.",
          "Setiap tindakan di terminal terikat pada identitas akun pengguna tertentu (*Accounting & Attribution*).",
          "Sistem tidak mengenali nama pengguna dalam komputasi internal, melainkan nomor numerik **UID**.",
          "Akun pengguna membatasi hak baca, tulis, dan eksekusi pada berkas serta proses sistem."
        ],
        targetCmd: "id siswa",
        targetHint: "Tampilkan UID dan GID milik user siswa dengan: id siswa",
        sesi: "SESI 1: DATABASE AKUN & PENGGUNA"

      // SLIDE 4: KLASIFIKASI AKUN
      {
        cat: "KLASIFIKASI AKUN",
        title: "Tiga Kategori Pengguna di Linux",
        bullets: [
          "<strong>1. Superuser (Root - UID 0):</strong> Penguasa mutlak sistem tanpa batasan izin apapun.",
          "<strong>2. System/Service Accounts (UID 1–999):</strong> Akun khusus untuk menjalankan daemon otomatis (misal: `www-data`, `mysql`, `sshd`) tanpa hak login interaktif.",
          "<strong>3. Regular Users (UID 1000+):</strong> Akun pengguna manusia biasa dengan izin terbatas pada direktori kerja home-nya."

    // Render Thumbnail Drawer
    function renderThumbnails() {
      thumbList.innerHTML = "";
      slidesData.forEach((slide, idx) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb-card" + (idx === currentSlide ? " active" : "");
        thumb.id = `thumb-${idx}`;
        thumb.onclick = () => {
          goToSlide(idx);
          toggleSidebar();
        };

        const tagText = slide.isCover ? "COVER" : (slide.isOutro ? "PENUTUP" : (slide.cat || "MATERI"));
        const titleText = slide.title || `Slide #${idx + 1}`;

        thumb.innerHTML = `
          <div class="thumb-top-row">
            <span class="thumb-num">#${String(idx + 1).padStart(2, '0')}</span>
            <span class="thumb-tag">${tagText}</span>
          </div>
          <div class="thumb-title">${titleText}</div>
        `;
        thumbList.appendChild(thumb);
      });
    }

    function filterThumbnails() {
      const q = document.getElementById("sidebar-filter").value.toLowerCase();
      slidesData.forEach((slide, idx) => {
        const el = document.getElementById(`thumb-${idx}`);
        const textToSearch = `${idx + 1} ${slide.title || ""} ${slide.cat || ""} ${slide.subtitle || ""}`.toLowerCase();
        if (textToSearch.includes(q)) {
          el.style.display = "flex";
        } else {
          el.style.display = "none";
        }
      });
    }

    function toggleSidebar() {
      const isOpen = slideSidebar.classList.contains("open");
      if (isOpen) {
        slideSidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
      } else {
        slideSidebar.classList.add("open");
        sidebarOverlay.classList.add("open");
        const activeThumb = document.getElementById(`thumb-${currentSlide}`);
        if (activeThumb) {
          activeThumb.scrollIntoView({ block: "center", behavior: "smooth" });
        }
        document.getElementById("sidebar-filter").focus();
      }
    }

                <span class="meta-pill-item">📊 ${slide.meta2}</span>
              </div>
            </div>
          `;
        } else if (slide.isOutro) {
          card.innerHTML = `
            <h1 class="outro-title">${slide.title}</h1>
            <p class="outro-quote">${slide.quote}</p>
            
            <div class="contact-grid">
              <div class="contact-card">
                <div class="contact-icon">✉️</div>
                <div class="contact-label">Email Kejuruan</div>
                <div class="contact-val">${slide.email}</div>
              </div>
              <div class="contact-card">
                <div class="contact-icon">📸</div>
                <div class="contact-label">Instagram TKJ</div>
                <div class="contact-val">${slide.instagram}</div>
              </div>
              <div class="contact-card">
                <div class="contact-icon">🌐</div>
                <div class="contact-label">Portal Sekolah</div>
                <div class="contact-val">${slide.website}</div>
              </div>
            </div>

            <div class="meta-pill-item" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); padding: 8px 18px; border-radius: 8px; color: #cbd5e1; font-size: 0.85rem; margin-top: 10px;">
              <span>🛡️ Laboratorium Jaringan Komputer & Keamanan Siber — SMK Wikrama Kota Bogor</span>
            </div>
          `;
        } else {
          let bulletsHtml = slide.bullets.map(b => `<li>${b}</li>`).join("");

          card.innerHTML = `
            <div class="slide-header">
              <div class="slide-category">${slide.cat}</div>
              <h2 class="slide-title">${slide.title}</h2>
            </div>
            <div class="slide-body">
              <div class="text-content">
                <ul>${bulletsHtml}</ul>
                <div style="margin-top: 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; font-size: 0.95rem;">
                  <strong style="color: #1e40af;">🎯 Tantangan Praktik Slide Ini:</strong><br>
                  <span style="color: #1e3a8a;">${slide.targetHint || "Ketik perintah di terminal interaktif sebelah kanan."}</span>
                </div>
              </div>

              <!-- Terminal Ubuntu Simulasi Interaktif -->
              <div class="terminal-container">
                <div class="terminal-header-bar">
                  <div class="terminal-dots">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                  </div>
                  <div class="terminal-tab-title">bash — siswa@wikrama-lab:${currentDir}</div>
                  <span class="challenge-status status-pending" id="status-badge-${idx}">Tantangan Belum Dicoba</span>
                </div>
                
                <div class="terminal-screen" id="term-screen-${idx}" onclick="focusTerminalInput(${idx})">
                  <div class="history-entry">
                    <span style="color: #64748b;"># Ubuntu Accounts & Sudoers Interactive Lab</span><br>
                    <span style="color: #64748b;"># Jalankan perintah administrasi Linux sesuai materi dan perhatikan responnya.</span>
                  </div>
                  <div id="cmd-history-output-${idx}"></div>
                  
                  <div class="terminal-input-row">
                    <span class="term-prompt">siswa@wikrama-lab</span>:<span class="term-path">${currentDir}</span><span class="term-char">$</span>
                    <input type="text" class="term-input" id="term-input-${idx}" autocomplete="off" spellcheck="false" 
                      onkeydown="handleTerminalInput(event, ${idx}, '${slide.targetCmd || ""}')" />
                  </div>
                </div>

                <div class="terminal-footer-hint">
                  <span>Target: <code style="color: #38bdf8;">${slide.targetCmd || "Bebas Eksplorasi"}</code></span>
                  ${slide.targetCmd ? `<button class="copy-btn" onclick="autoFillCmd(${idx}, '${slide.targetCmd}')">Salin ke Input</button>` : ""}
                </div>
              </div>
            </div>
          `;
        }
        deck.appendChild(card);
      });
      renderThumbnails();
      updateMeta();
    }

    function updateMeta() {
      slideNum.innerText = `Slide ${currentSlide + 1} of ${totalSlides}`;
      sessionTag.innerText = slidesData[currentSlide].sesi;
      
      const cards = document.querySelectorAll(".slide-card");
      cards.forEach((c, i) => c.classList.toggle("active", i === currentSlide));

      const thumbs = document.querySelectorAll(".thumb-card");
      thumbs.forEach((t, i) => t.classList.toggle("active", i === currentSlide));

      setTimeout(() => {
        focusTerminalInput(currentSlide);
      }, 100);
    }

    function focusTerminalInput(slideIdx) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) inp.focus();
    }

    function autoFillCmd(slideIdx, cmdText) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      if (inp) {
        inp.value = cmdText;
        inp.focus();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlide = index;
        updateMeta();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateMeta();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateMeta();
      }
    }

    // Engine Eksekusi Terminal Akun & Sudoers
    function handleTerminalInput(e, slideIdx, targetCommand) {
      const inp = document.getElementById(`term-input-${slideIdx}`);
      const historyDiv = document.getElementById(`cmd-history-output-${slideIdx}`);
      const statusBadge = document.getElementById(`status-badge-${slideIdx}`);

      if (e.key === "Enter") {
        const rawCmd = inp.value.trim();
        if (!rawCmd) return;

        cmdHistory.push(rawCmd);
        historyIdx = cmdHistory.length;

        const entryHtml = document.createElement("div");
        entryHtml.className = "history-entry";
        entryHtml.innerHTML = `<div><span class="term-prompt">siswa@wikrama-lab</span>:<span class="term-path">${currentDir}</span><span class="term-char">$</span> ${escapeHtml(rawCmd)}</div>`;

        const [outputHtml, isSuccess] = executeMockAccountBash(rawCmd);
        entryHtml.innerHTML += outputHtml;
        historyDiv.appendChild(entryHtml);

        const cleanRaw = rawCmd.replace(/\s+/g, " ").trim();
        const cleanTarget = targetCommand.replace(/\s+/g, " ").trim();

        if (cleanTarget && (cleanRaw === cleanTarget || cleanRaw.includes(cleanTarget))) {
          statusBadge.className = "challenge-status status-success";
          statusBadge.innerText = "✓ TANTANGAN BERHASIL!";
          const successAlert = document.createElement("div");
          successAlert.className = "term-output success-msg";
          successAlert.innerText = "🎉 Sempurna! Perintah administrasi akun & sudoers tepat sesuai modul.";
          historyDiv.appendChild(successAlert);
        }

        inp.value = "";
        const screen = document.getElementById(`term-screen-${slideIdx}`);
        screen.scrollTop = screen.scrollHeight;
      } else if (e.key === "ArrowUp") {
        if (cmdHistory.length > 0 && historyIdx > 0) {
          historyIdx--;
          inp.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inp.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          inp.value = "";
        }
      }
    }

    function executeMockAccountBash(cmd) {
      const parts = cmd.split(" ");
      const base = parts[0].toLowerCase();

      // Penanganan Pipeline & Perintah Khusus
      if (cmd.includes("awk -F:") && cmd.includes("$3 == 0")) {
        return [`<div class="term-output">root</div>`, true];
      }
      if (cmd.includes("grep root /etc/shadow") || cmd.includes("grep root /etc/passwd")) {
        return [`<div class="term-output">root:x:0:0:root:/root:/bin/bash</div>`, true];
      }
      if (cmd.includes("grep siswa /etc/passwd")) {
        return [`<div class="term-output">siswa:x:1000:1000:Siswa TKJ:/home/siswa:/bin/bash</div>`, true];
      }
      if (cmd.includes("grep sudo /etc/group") || cmd.includes("grep '%sudo' /etc/sudoers")) {
        return [`<div class="term-output">%sudo	ALL=(ALL:ALL) ALL</div>`, true];
      }
      if (cmd.includes("grep PASS_MAX_DAYS")) {
        return [`<div class="term-output">PASS_MAX_DAYS	90</div>`, true];
      }
      if (cmd.includes("grep sudo /var/log/auth.log")) {
        return [`<div class="term-output">Sep 21 08:30:12 wikrama-lab sudo[1040]:    siswa : TTY=pts/0 ; PWD=/home/siswa ; USER=root ; COMMAND=/usr/bin/head -n 2 /etc/shadow
Sep 21 09:15:20 wikrama-lab sudo[1120]:    siswa : TTY=pts/0 ; PWD=/home/siswa ; USER=root ; COMMAND=/usr/sbin/chage -M 60 siswa</div>`, true];
      }
      if (cmd.includes("grep www-data /etc/passwd")) {
        return [`<div class="term-output">www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin</div>`, true];
      }

      switch (base) {
        case "whoami":
          return [`<div class="term-output">siswa</div>`, true];

        case "id":
          if (cmd.includes("siswa")) {
            return [`<div class="term-output">uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo),1002(soc_analyst)</div>`, true];
          }
          if (cmd.includes("-u")) return [`<div class="term-output">1000</div>`, true];
          if (cmd.includes("-Gn")) return [`<div class="term-output">siswa sudo soc_analyst</div>`, true];
          return [`<div class="term-output">uid=1000(siswa) gid=1000(siswa) groups=1000(siswa),27(sudo)</div>`, true];

        case "groups":
          return [`<div class="term-output">siswa sudo soc_analyst</div>`, true];

        case "clear":
          setTimeout(() => {
            const hist = document.getElementById(`cmd-history-output-${currentSlide}`);
            if (hist) hist.innerHTML = "";
          }, 50);
          return ["", true];

        case "who":
          return [`<div class="term-output">siswa    pts/0        2026-09-21 08:00 (192.168.1.50)
helpdesk pts/1        2026-09-21 09:30 (192.168.1.88)</div>`, true];

        case "w":
          return [`<div class="term-output"> 10:15:20 up  2:15,  2 users,  load average: 0.10, 0.12, 0.09
USER     TTY      FROM             LOGIN@   IDLE   JCPU   PCPU WHAT
siswa    pts/0    192.168.1.50     08:00    1.00s  0.15s  0.02s w
helpdesk pts/1    192.168.1.88     09:30   12.00s  0.08s  0.08s -bash</div>`, true];

        case "last":
          return [`<div class="term-output">siswa    pts/0        192.168.1.50     Mon Sep 21 08:00   still logged in
helpdesk pts/1        192.168.1.88     Mon Sep 21 09:30   still logged in
reboot   system boot  6.8.0-45-generic Mon Sep 21 08:00   still running
root     pts/0        192.168.1.50     Sun Sep 20 18:22 - 19:10  (00:48)
siswa    pts/0        192.168.1.50     Sun Sep 20 14:10 - 17:00  (02:50)

wtmp begins Sun Sep 20 14:00:00 2026</div>`, true];

        case "head":
          if (cmd.includes("/etc/passwd")) {
            return [`<div class="term-output">root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin</div>`, true];
          }
          if (cmd.includes("/etc/shadow")) {
            return [`<div class="term-output">root:$6$rounds=4096$v9sK...$hashedrootpassword:19820:0:99999:7:::\ndaemon:*:19800:0:99999:7:::</div>`, true];
          }
          return [`<div class="term-output">root:x:0:0:root:/root:/bin/bash</div>`, true];

        case "chage":
          if (cmd.includes("-l")) {
            return [`<div class="term-output">Last password change					: Sep 21, 2026
Password expires					: Dec 20, 2026
Password inactive					: never
Account expires						: never
Minimum number of days between password change		: 0
Maximum number of days between password change		: 90
Number of days of warning before password expires	: 7</div>`, true];
          }
          return ["", true];

        case "sudo":
          if (cmd.includes("-l")) {
            if (cmd.includes("helpdesk")) {
              return [`<div class="term-output">User helpdesk may run the following commands on wikrama-lab:
    (root) /usr/bin/systemctl restart nginx, (root) /usr/bin/systemctl status *</div>`, true];
            }
            return [`<div class="term-output">Matching Defaults entries for siswa on wikrama-lab:
    env_reset, mail_badpass, secure_path=/usr/local/sbin\\:/usr/local/bin\\:/usr/sbin\\:/usr/bin\\:/sbin\\:/bin

User siswa may run the following commands on wikrama-lab:
    (ALL : ALL) ALL</div>`, true];
          }
          if (cmd.includes("-V")) {
            return [`<div class="term-output">Sudo version 1.9.15p5\nSudoers policy grammar version 50</div>`, true];
          }
          if (cmd.includes("-k")) {
            return [`<div class="term-output">[sudo] credentials cache invalidated.</div>`, true];
          }
          if (cmd.includes("faillock")) {
            return [`<div class="term-output">siswa:
When                Type  Source                                           Valid
2026-09-21 07:45:10 RHOST 192.168.1.105                                         V</div>`, true];
          }
          if (cmd.includes("passwd") || cmd.includes("useradd") || cmd.includes("usermod") || cmd.includes("userdel") || cmd.includes("groupadd") || cmd.includes("gpasswd") || cmd.includes("chage")) {
            return [`<div class="term-output" style="color:#34d399;">Operasi administrasi berhasil dieksekusi via sudo.</div>`, true];
          }
          if (cmd.includes("cat /etc/shadow")) {
            return [`<div class="term-output">${escapeHtml(virtualUsersDB["/etc/shadow"])}</div>`, true];
          }
          if (cmd.includes("cat /etc/sudoers")) {
            return [`<div class="term-output">${escapeHtml(virtualUsersDB["/etc/sudoers"])}</div>`, true];
          }
          if (cmd.includes("cat /etc/sudoers.d/helpdesk")) {
            return [`<div class="term-output">${escapeHtml(virtualUsersDB["/etc/sudoers.d/helpdesk"])}</div>`, true];
          }
          if (cmd.includes("find /etc/sudoers.d")) {
            return [`<div class="term-output">/etc/sudoers.d/README\n/etc/sudoers.d/helpdesk</div>`, true];
          }
          return [`<div class="term-output" style="color:#34d399;">Sudo command executed.</div>`, true];

        case "cat":
          const f = parts[1] || "";
          if (virtualUsersDB[f]) {
            return [`<div class="term-output">${escapeHtml(virtualUsersDB[f])}</div>`, true];
          }
          if (f === "/etc/issue") {
            return [`<div class="term-output">Ubuntu 24.04 LTS \\n \\l</div>`, true];
          }
          return [`<div class="term-output error">cat: ${escapeHtml(f)}: No such file or directory</div>`, false];

        case "ls":
          if (cmd.includes("-l /etc/passwd")) {
            return [`<div class="term-output">-rw-r--r-- 1 root root 1840 Sep 21 08:30 /etc/passwd</div>`, true];
          }
          if (cmd.includes("-la /etc/skel")) {
            return [`<div class="term-output">drwxr-xr-x  2 root root 4096 Apr  8 08:00 .
drwxr-xr-x 95 root root 4096 Sep 21 08:00 ..
-rw-r--r--  1 root root  220 Apr  8 08:00 .bash_logout
-rw-r--r--  1 root root 3771 Apr  8 08:00 .bashrc
-rw-r--r--  1 root root  807 Apr  8 08:00 .profile</div>`, true];
          }
          return [`<div class="term-output">documents   downloads   status.txt</div>`, true];

        case "newgrp":
          return [`<div class="term-output" style="color:#38bdf8;">Berhasil beralih ke sub-shell grup ${parts[1] || "soc_analyst"}.</div>`, true];

        case "echo":
          const textMatch = cmd.match(/echo\s+["']?([^"'>]+)["']?/);
          return [`<div class="term-output">${escapeHtml(textMatch ? textMatch[1] : parts.slice(1).join(" "))}</div>`, true];

        default:
          return [`<div class="term-output error">bash: ${escapeHtml(base)}: command not found</div>`, false];
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("keydown", (e) => {
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.classList.contains("term-input") || activeEl.id === "sidebar-filter");

      if (e.key === "m" || e.key === "M") {
        if (!isTyping) {
          e.preventDefault();
          toggleSidebar();
          return;
        }
      }

      if (e.key === "Escape") {
        if (slideSidebar.classList.contains("open")) {
          toggleSidebar();
          return;
        }
      }

      if (!isTyping) {
        if (e.key === "ArrowRight" || e.key === " ") {
          nextSlide();
        } else if (e.key === "ArrowLeft") {
          prevSlide();
        }
      }
    });

    renderDeck();
  </script>
