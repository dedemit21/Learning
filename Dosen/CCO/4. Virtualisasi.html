    // --- SYNTHESIZED SOUND EFFECTS (Web Audio API - No External Files) ---
    const SoundFx = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(type) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'click') {
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.18);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        } catch (e) {
          console.warn("Sound error", e);
        }
      }
    };

      deployBatch(count, type) {
        for (let i = 0; i < count; i++) {
          const spec = this.workloads[type];
          if (this.usedRam + spec.ram > this.serverMaxRam || this.usedCpu + spec.cpu > this.serverMaxCpu) {
            SoundFx.play('error');
            this.triggerOOM(type);
            break;
          }
          this.usedRam += spec.ram;
          this.usedCpu = Math.round((this.usedCpu + spec.cpu) * 10) / 10;
          this.instances.push({ type, id: Date.now() + Math.random() });

        SoundFx.play('click');

        const alertBox = document.getElementById('g2-status-alert');

          alertBox.className = "p-2.5 bg-rose-950/70 border border-rose-600 rounded-lg text-xs text-rose-200 animate-bounce";

        this.updateView();

        const ramPct = Math.min(100, Math.round((this.usedRam / this.serverMaxRam) * 100));

        // Update Text
        const ramTxt = document.getElementById('g2-used-ram');
        const cpuTxt = document.getElementById('g2-used-cpu');
        const ramPctTxt = document.getElementById('g2-ram-percent');
        const cpuPctTxt = document.getElementById('g2-cpu-percent');
        const ramBar = document.getElementById('g2-ram-bar');
        const cpuBar = document.getElementById('g2-cpu-bar');
        const instCount = document.getElementById('g2-instance-count');

        if (ramTxt) ramTxt.textContent = `${this.usedRam.toLocaleString()} MB (${ramPct}%)`;

        if (cpuPctTxt) cpuPctTxt.textContent = `${cpuPct}%`;

        if (ramBar) {
          ramBar.style.width = `${ramPct}%`;

        if (cpuBar) {
          cpuBar.style.width = `${cpuPct}%`;
          cpuBar.className = cpuPct > 85 ? 'bg-rose-500 h-full transition-all' : 'bg-cyan-500 h-full transition-all';

        const grid = document.getElementById('g2-instance-grid');

    };

    // --- TERMINAL SIMULATOR LOGIC ---
    const terminalSim = {
      history: [],
      containers: [],
      vms: [
        { name: "db-master", state: "running", mem: "2048MB" },
        { name: "backup-node", state: "shut off", mem: "1024MB" }
      ],

      handleKey(e) {
        if (e.key === 'Enter') {
          const input = e.target.value.trim();
          if (input) {
            this.runCmd(input);
            e.target.value = '';
          }
        }
      },

      runCmd(cmdText) {
        SoundFx.play('click');
        const output = document.getElementById('sim-output');
        if (!output) return;

        const cmdLine = document.createElement('div');
        cmdLine.className = "text-emerald-400 font-bold";
        cmdLine.textContent = `$ ${cmdText}`;
        output.appendChild(cmdLine);

        const resLine = document.createElement('div');
        resLine.className = "text-slate-300 pl-2 border-l border-slate-800 text-[11px] leading-relaxed";

        const lower = cmdText.toLowerCase().trim();

        if (lower === 'help') {
          resLine.innerHTML = `
            Perintah yang didukung di simulator ini:<br>
            • <strong class="text-brand-300">docker run &lt;app&gt;</strong> : Menjalankan container baru<br>
            • <strong class="text-brand-300">docker ps</strong> : Melihat container yang sedang berjalan<br>
            • <strong class="text-indigo-300">virsh list</strong> : Melihat daftar Virtual Machine KVM<br>
            • <strong class="text-indigo-300">virsh start &lt;name&gt;</strong> : Menyalakan VM<br>
            • <strong class="text-emerald-300">free -m</strong> : Cek konsumsi memori sistem<br>
            • <strong class="text-slate-400">clear</strong> : Membersihkan layar terminal
          `;
        } else if (lower.startsWith('docker run')) {
          const appName = lower.replace('docker run', '').trim() || 'web-app';
          const containerId = Math.random().toString(36).substring(2, 10);
          this.containers.push({ id: containerId, image: appName, status: "Up 2 seconds" });
          resLine.innerHTML = `<span class="text-emerald-400">Container started successfully!</span><br>Container ID: ${containerId} | Image: ${appName} (Status: Healthy)`;
        } else if (lower === 'docker ps') {
          if (this.containers.length === 0) {
            resLine.textContent = "CONTAINER ID   IMAGE      COMMAND    CREATED        STATUS    PORTS";
          } else {
            let html = "<pre>CONTAINER ID   IMAGE          STATUS\n";
            this.containers.forEach(c => {
              html += `${c.id}       ${c.image.padEnd(14)} ${c.status}\n`;
            });
            html += "</pre>";
            resLine.innerHTML = html;
          }
        } else if (lower === 'virsh list' || lower === 'virsh list --all') {
          let html = "<pre> Id   Name          State\n---------------------------\n";
          this.vms.forEach((vm, idx) => {
            html += ` ${idx + 1}    ${vm.name.padEnd(13)} ${vm.state}\n`;
          });
          html += "</pre>";
          resLine.innerHTML = html;
        } else if (lower.startsWith('virsh start')) {
          const target = lower.replace('virsh start', '').trim();
          const found = this.vms.find(v => v.name === target);
          if (found) {
            found.state = "running";
            resLine.innerHTML = `<span class="text-indigo-400">Domain ${target} started</span>`;
          } else {
            resLine.innerHTML = `<span class="text-rose-400">error: failed to get domain '${target}'</span>`;
          }
        } else if (lower === 'free -m') {
          resLine.innerHTML = `
            <pre>               total        used        free      shared  buff/cache   available
Mem:           16384        2140       11244         120        3000       13980
Swap:           4096           0        4096</pre>
          `;
        } else if (lower === 'clear') {
          output.innerHTML = '';
          return;
        } else {
          resLine.innerHTML = `<span class="text-rose-400">bash: ${cmdText}: command not found. Ketik 'help' untuk panduan.</span>`;
        }

        output.appendChild(resLine);
        output.scrollTop = output.scrollHeight;
      },

      clear() {
        const output = document.getElementById('sim-output');
        if (output) output.innerHTML = '<div class="text-slate-500">Terminal dibersihkan.</div>';
      }
    };

    // --- QUIZ MANAGER: 20 SOAL EVALUASI & REPORT ---
    const quizManager = {
      answers: {},
      isSubmitted: false,

      init() {
        this.renderQuestions();
      },

      renderQuestions() {
        const wrapper = document.getElementById('quiz-questions-wrapper');
        if (!wrapper) return;
        wrapper.innerHTML = '';

        quizQuestions.forEach((q, idx) => {
          const card = document.createElement('div');
          card.className = "p-4 bg-slate-950/80 border border-slate-800 rounded-xl space-y-3";
          
          let optionsHtml = '';
          q.options.forEach((opt, oIdx) => {
            const isChecked = this.answers[q.id] === oIdx;
            optionsHtml += `
              <label class="flex items-start gap-3 p-2.5 rounded-lg border border-slate-800/80 bg-slate-900 hover:bg-slate-800 cursor-pointer text-xs transition">
                <input type="radio" name="question_${q.id}" value="${oIdx}" ${isChecked ? 'checked' : ''} onchange="quizManager.selectAnswer(${q.id}, ${oIdx})" class="mt-0.5 text-brand-600 focus:ring-0">
                <span class="text-slate-300 leading-relaxed">${opt}</span>
              </label>
            `;
          });

          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <span class="text-xs font-bold text-brand-400 font-mono">Soal No. ${idx + 1} dari 20</span>
              <span class="text-[11px] px-2 py-0.5 bg-slate-800 text-slate-400 rounded">Bobot: 5 Poin</span>
            </div>
            <p class="text-sm font-semibold text-white leading-relaxed">${q.question}</p>
            <div class="space-y-2">
              ${optionsHtml}
            </div>
          `;
          wrapper.appendChild(card);
        });

        this.updateAnsweredCounter();
      },

      selectAnswer(qId, optionIdx) {
        this.answers[qId] = optionIdx;
        SoundFx.play('click');
        this.updateAnsweredCounter();
      },

      updateAnsweredCounter() {
        const count = Object.keys(this.answers).length;
        const el = document.getElementById('quiz-answered-count');
        if (el) el.textContent = count;
      },

      resetQuiz() {
        this.answers = {};
        this.isSubmitted = false;
        this.renderQuestions();
        SoundFx.play('click');
      },

      submitAll() {
        const totalAnswered = Object.keys(this.answers).length;
        if (totalAnswered < 20) {
          if (!window.confirm(`Anda baru menjawab ${totalAnswered} dari 20 soal. Yakin ingin mengumpulkan sekarang?`)) {
            return;
          }
        }

        let correctCount = 0;
        quizQuestions.forEach(q => {
          if (this.answers[q.id] === q.answer) {
            correctCount++;
          }
        });

        const finalScore = correctCount * 5; // 20 * 5 = 100 max
        this.isSubmitted = true;

        if (finalScore >= 70) {
          SoundFx.play('success');
        } else {
          SoundFx.play('error');
        }

        // Tampilkan Hasil di Slide 32
        this.displayResults(finalScore, correctCount);
        app.jumpToSlide(32);
      },

      displayResults(score, correctCount) {
        const placeholder = document.getElementById('result-placeholder');
        const card = document.getElementById('result-card');
        const scoreVal = document.getElementById('final-score-val');
        const statusTxt = document.getElementById('final-status-text');
        const statsTxt = document.getElementById('final-stats-text');
        const gradeTxt = document.getElementById('final-grade-text');

        if (placeholder) placeholder.classList.add('hidden');
        if (card) card.classList.remove('hidden');

        if (scoreVal) scoreVal.textContent = `${score} / 100`;
        if (statsTxt) statsTxt.textContent = `${correctCount} Benar • ${20 - correctCount} Salah`;

        let grade = "E";
        let status = "BELUM LULUS (Remedial)";
        let statusColor = "text-rose-400";

        if (score >= 85) {
          grade = "A (Sangat Istimewa)";
          status = "LULUS DENGAN PUJIAN";
          statusColor = "text-emerald-400";
        } else if (score >= 70) {
          grade = "B (Kompeten)";
          status = "LULUS MEMENUHI STANDAR";
          statusColor = "text-brand-400";
        } else if (score >= 55) {
          grade = "C (Cukup)";
          status = "REMEDIAL RINGAN";
          statusColor = "text-amber-400";
        }

        if (statusTxt) {
          statusTxt.textContent = status;
          statusTxt.className = `text-lg font-bold ${statusColor}`;
        }
        if (gradeTxt) gradeTxt.textContent = grade;
      },

      showReviewModal() {
        let reviewHtml = `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl">
              <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                  <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
                  Pembahasan Lengkap Evaluasi (20 Soal)
                </h3>
                <button onclick="document.getElementById('modal-review').remove()" class="p-1 text-slate-400 hover:text-white rounded">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>
              </div>
              <div class="p-5 overflow-y-auto space-y-4 flex-1 text-xs">
        `;

        quizQuestions.forEach((q, idx) => {
          const userAns = this.answers[q.id];
          const isCorrect = userAns === q.answer;
          reviewHtml += `
            <div class="p-3.5 bg-slate-950 rounded-xl border ${isCorrect ? 'border-emerald-600/50' : 'border-rose-600/50'} space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-300">Nomor ${idx + 1}: ${q.question}</span>
                <span class="font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${isCorrect ? '✓ Benar' : '✗ Salah'}</span>
              </div>
              <div class="text-slate-400">Kunci Jawaban: <strong class="text-emerald-300">${q.options[q.answer]}</strong></div>
              ${!isCorrect && userAns !== undefined ? `<div class="text-slate-400">Jawaban Anda: <strong class="text-rose-300">${q.options[userAns]}</strong></div>` : ''}
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 italic mt-1">
                <strong>Pembahasan:</strong> ${q.explanation}
              </div>
            </div>
          `;
        });

        reviewHtml += `
              </div>
              <div class="p-3 border-t border-slate-800 text-right">
                <button onclick="document.getElementById('modal-review').remove()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold">Tutup Review</button>
              </div>
            </div>
          </div>
        `;

        const modalDiv = document.createElement('div');
        modalDiv.id = "modal-review";
        modalDiv.innerHTML = reviewHtml;
        document.body.appendChild(modalDiv);
        lucide.createIcons();
      }
    };

    // --- MAIN SPA CONTROLLER ---
    const app = {
      currentSlideIdx: 0,
      totalSlides: slidesData.length,

      init() {
        this.renderDrawerTOC();
        this.showSlide(0);
        this.setupEventListeners();
      },

      setupEventListeners() {
        // Navigation Buttons
        document.getElementById('btn-prev-slide').onclick = () => this.prevSlide();
        document.getElementById('btn-next-slide').onclick = () => this.nextSlide();

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
          // Abaikan jika user sedang mengetik di terminal simulator
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'ArrowRight' || e.key === 'PageDown') {
            this.nextSlide();
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            this.prevSlide();
          }
        });

        // Drawer Handlers
        const btnMenu = document.getElementById('btn-toggle-menu');
        const btnClose = document.getElementById('btn-close-drawer');
        const drawer = document.getElementById('sidebar-drawer');
        const backdrop = document.getElementById('drawer-backdrop');

        const toggleDrawer = () => {
          drawer.classList.toggle('-translate-x-full');
          backdrop.classList.toggle('hidden');
        };

        btnMenu.onclick = toggleDrawer;
        btnClose.onclick = toggleDrawer;
        backdrop.onclick = toggleDrawer;

        // Sound Toggle
        const btnSound = document.getElementById('btn-sound-toggle');
        const soundIcon = document.getElementById('sound-icon');
        btnSound.onclick = () => {
          SoundFx.enabled = !SoundFx.enabled;
          soundIcon.setAttribute('data-lucide', SoundFx.enabled ? 'volume-2' : 'volume-x');
          btnSound.className = SoundFx.enabled 
            ? "p-2 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded-lg transition"
            : "p-2 text-rose-400 hover:bg-slate-800 rounded-lg transition";
          lucide.createIcons();
          this.showToast(SoundFx.enabled ? "Efek Suara Diaktifkan" : "Efek Suara Dimatikan");
        };

        // Fullscreen Toggle
        const btnFull = document.getElementById('btn-fullscreen');
        if (btnFull) {
          btnFull.onclick = () => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen().catch(() => {});
            }
          };
        }
      },

      renderDrawerTOC() {
        const list = document.getElementById('table-of-contents-list');
        if (!list) return;
        list.innerHTML = '';

        slidesData.forEach((s, idx) => {
          const btn = document.createElement('button');
          btn.id = `toc-item-${idx}`;
          btn.className = `w-full text-left p-2.5 rounded-lg text-xs font-medium transition flex items-center gap-2.5 hover:bg-slate-800 text-slate-300`;
          btn.onclick = () => {
            this.jumpToSlide(idx);
            document.getElementById('sidebar-drawer').classList.add('-translate-x-full');
            document.getElementById('drawer-backdrop').classList.add('hidden');
          };
          btn.innerHTML = `
            <span class="w-5 h-5 rounded bg-slate-800 flex items-center justify-center font-mono text-[10px] text-slate-400 flex-shrink-0">${idx + 1}</span>
            <div class="truncate">
              <div class="text-[10px] text-brand-400 uppercase tracking-wider">${s.category}</div>
              <div class="truncate text-white font-semibold">${s.title}</div>
            </div>
          `;
          list.appendChild(btn);
        });
      },

      showSlide(idx) {
        if (idx < 0 || idx >= this.totalSlides) return;
        this.currentSlideIdx = idx;
        const s = slidesData[idx];

        // Update Top Bar & Header Text
        document.getElementById('topbar-slide-title').textContent = s.title;
        document.getElementById('slide-counter-badge').textContent = `Slide ${idx + 1} / ${this.totalSlides}`;

        // Progress Calculation
        const progressPct = Math.round(((idx + 1) / this.totalSlides) * 100);
        document.getElementById('top-progress-fill').style.width = `${progressPct}%`;
        document.getElementById('drawer-progress-bar').style.width = `${progressPct}%`;
        document.getElementById('drawer-progress-text').textContent = `${progressPct}%`;

        // Update Navigation Button States
        const btnPrev = document.getElementById('btn-prev-slide');
        const btnNext = document.getElementById('btn-next-slide');
        btnPrev.disabled = (idx === 0);
        if (idx === this.totalSlides - 1) {
          btnNext.innerHTML = `<span>Selesai</span> <i data-lucide="check" class="w-4 h-4"></i>`;
        } else {
          btnNext.innerHTML = `<span>Selanjutnya</span> <i data-lucide="chevron-right" class="w-4 h-4"></i>`;
        }

        // Highlight TOC Item
        for (let i = 0; i < this.totalSlides; i++) {
          const el = document.getElementById(`toc-item-${i}`);
          if (el) {
            if (i === idx) {
              el.className = "w-full text-left p-2.5 rounded-lg text-xs font-medium transition flex items-center gap-2.5 bg-brand-600/20 border border-brand-500/40 text-brand-300";
            } else {
              el.className = "w-full text-left p-2.5 rounded-lg text-xs font-medium transition flex items-center gap-2.5 hover:bg-slate-800 text-slate-300";
            }
          }
        }

        // Inject Content with Entrance Animation
        const container = document.getElementById('slide-container');
        container.classList.remove('slide-enter');
        void container.offsetWidth; // Force CSS Reflow
        container.classList.add('slide-enter');

        container.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800/80">
              <span class="text-xs font-mono font-bold text-brand-400 uppercase tracking-widest flex items-center gap-1.5">
                <i data-lucide="hash" class="w-3.5 h-3.5"></i> Modul ${idx + 1} • ${s.category}
              </span>
              <span class="text-xs text-slate-400 font-medium">Teknik Informatika / Sistem Komputer</span>
            </div>
            <div>
              ${s.content}
            </div>
          </div>
        `;

        lucide.createIcons();

        // Specific Slide Logic Initialization
        if (idx === 19 || idx === 20) {
          setTimeout(() => game1.init(), 50);
        } else if (idx === 21 || idx === 22) {
          setTimeout(() => game2.updateView(), 50);
        } else if (idx === 30 || idx === 31) {
          setTimeout(() => quizManager.init(), 50);
        }
      },

      nextSlide() {
        if (this.currentSlideIdx < this.totalSlides - 1) {
          SoundFx.play('click');
          this.showSlide(this.currentSlideIdx + 1);
        }
      },

      prevSlide() {
        if (this.currentSlideIdx > 0) {
          SoundFx.play('click');
          this.showSlide(this.currentSlideIdx - 1);
        }
      },

      jumpToSlide(targetIdx) {
        if (targetIdx >= 0 && targetIdx < this.totalSlides) {
          SoundFx.play('click');
          this.showSlide(targetIdx);
        }
      },

      showToast(msg) {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const toast = document.createElement('div');
        toast.className = "px-3 py-2 bg-slate-900 border border-slate-700 text-white rounded-lg text-xs shadow-xl flex items-center gap-2 animate-pulse-once";
        toast.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5 text-brand-400"></i> <span>${msg}</span>`;
        c.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => toast.remove(), 2400);
      }
    };

    // Run on Load
    window.onload = function () {
      app.init();
      lucide.createIcons();
    };
  </script>
</body>
</html>
